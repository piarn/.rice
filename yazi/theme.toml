#:schema https://yazi-rs.github.io/schemas/theme.json
# Forest Night — generated by ~/.rice/bin/apply-theme from ~/.rice/themes/forest-night/theme.toml.
#
# Source of truth for ~/.config/yazi/theme.toml, which is a symlink to this
# file via ~/.dots/yazi (TOML has no include directive, so unlike the other
# ~/.rice apps this file *is* the config, not something sourced from it).
#
# Only touches UI chrome (borders, status bar, tabs, modes, markers, popups)
# and the broad filetype.rules mime groups — never the per-extension
# icon/brand-color tables ([icon].{globs,dirs,files,exts,conds}), same call
# as leaving code syntax highlighting alone in the nvim theme.

[flavor]
dark  = ""
light = ""

[app]
overall = {}

# : Manager

[mgr]
cwd = { fg = "#2f6b44" }

find_keyword  = { fg = "#e0b84f", bold = true, italic = true, underline = true }
find_position = { fg = "#c77dd1", bg = "reset", bold = true, italic = true }

symlink_target = { italic = true }

marker_copied   = { fg = "#4bab6d", bg = "#4bab6d" }
marker_cut      = { fg = "#e0605a", bg = "#e0605a" }
marker_marked   = { fg = "#4fd8b0", bg = "#4fd8b0" }
marker_selected = { fg = "#e0b84f", bg = "#e0b84f" }
marker_symbol   = "│"

count_copied   = { fg = "#060b07", bg = "#2f6b44" }
count_cut      = { fg = "#060b07", bg = "#e0605a" }
count_selected = { fg = "#060b07", bg = "#e0b84f" }

border_symbol = "│"
border_style  = { fg = "#1f3725" }

syntect_theme = ""

# : Tabs

[tabs]
active   = { fg = "#060b07", bg = "#2f6b44", bold = true }
inactive = { fg = "#6a7c6e", bg = "#060b07" }

sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

# : Mode

[mode]
normal_main = { fg = "#060b07", bg = "#2f6b44", bold = true }
normal_alt  = { fg = "#2f6b44", bg = "#060b07" }

select_main = { fg = "#060b07", bg = "#e0605a", bold = true }
select_alt  = { fg = "#e0605a", bg = "#060b07" }

unset_main = { fg = "#060b07", bg = "#e0b84f", bold = true }
unset_alt  = { fg = "#e0b84f", bg = "#060b07" }

# : Indicator of hovered file

[indicator]
parent  = { reversed = true }
current = { reversed = true }
preview = { underline = true }
padding = { open = "", close = "" }

# : Status bar

[status]
overall   = {}
sep_left  = { open = "", close = "" }
sep_right = { open = "", close = "" }

perm_sep   = { fg = "#1f3725" }
perm_type  = { fg = "#2f6b44" }
perm_read  = { fg = "#4bab6d" }
perm_write = { fg = "#e0605a" }
perm_exec  = { fg = "#4fd8b0" }

progress_label  = { bold = true }
progress_normal = { fg = "#2f6b44", bg = "#060b07" }
progress_error  = { fg = "#e0b84f", bg = "#e0605a" }

# : Which

[which]
cols            = 3
mask            = { bg = "#060b07" }
cand            = { fg = "#2f6b44" }
rest            = { fg = "#1f3725" }
desc            = { fg = "#c77dd1" }
separator       = "  "
separator_style = { fg = "#1f3725" }

# : Confirmation

[confirm]
border     = { fg = "#2f6b44" }
title      = { fg = "#2f6b44" }
body       = {}
list       = {}
btn_yes    = { reversed = true }
btn_no     = {}
btn_labels = [ "  [Y]es  ", "  (N)o  " ]

# : Spotter

[spot]
border = { fg = "#2f6b44" }
title  = { fg = "#2f6b44" }

tbl_col  = { fg = "#4bab6d" }
tbl_cell = { fg = "#e0b84f", reversed = true }

# : Notification

[notify]
title_info  = { fg = "#2f6b44" }
title_warn  = { fg = "#e0b84f" }
title_error = { fg = "#e0605a" }

icon_info  = ""
icon_warn  = ""
icon_error = ""

# : Picker

[pick]
border   = { fg = "#2f6b44" }
active   = { fg = "#4bab6d", bold = true }
inactive = {}

# : Input

[input]
border   = { fg = "#2f6b44" }
title    = {}
value    = {}
selected = { reversed = true }

# : Completion

[cmp]
border   = { fg = "#2f6b44" }
active   = { reversed = true }
inactive = {}

icon_file    = ""
icon_folder  = ""
icon_command = ""

# : Task manager

[tasks]
border  = { fg = "#2f6b44" }
title   = {}
hovered = { fg = "#4bab6d", bold = true }

# : Help menu

[help]
on      = { fg = "#4fd8b0" }
run     = { fg = "#c77dd1" }
desc    = {}
hovered = { reversed = true, bold = true }
footer  = { fg = "#060b07", bg = "#2f6b44" }

# : File-specific styles (broad mime groups only — see note at top)

[filetype]
rules = [
	{ mime = "image/*", fg = "#c77dd1" },
	{ mime = "{audio,video}/*", fg = "#c77dd1" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", fg = "#e0605a" },
	{ mime = "application/{pdf,doc,rtf}", fg = "#4fd8b0" },
	{ mime = "vfs/{absent,stale}", fg = "#4b584e" },
	{ url = "*", is = "orphan", bg = "#e0605a" },
	{ url = "*", is = "exec"  , fg = "#2f6b44" },
	{ url = "*", is = "dummy", bg = "#e0605a" },
	{ url = "*/", is = "dummy", bg = "#e0605a" },
	{ url = "*/", fg = "#2f6b44" },
]
