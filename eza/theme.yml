# Crimson — generated by ~/.rice/bin/apply-theme from ~/.rice/themes/crimson/theme.toml.
# Loaded via EZA_CONFIG_DIR=~/.rice/eza (must be named theme.yml), set from
# ~/.dots/fish/.config/fish/conf.d/00-rice.fish -> ~/.rice/eza/colors.fish.
#
# NOTE: eza applies LS_COLORS, then EZA_COLORS, *after* this file — so the
# ten classic file-kind codes (di, ln, ex, pi, so, bd, cd, or) get
# overridden by whatever LS_COLORS this system already exports (dircolors).
# ~/.rice/eza/colors.fish sets an EZA_COLORS that reclaims those specific
# codes to match the palette below; everything else here isn't touched by
# LS_COLORS/EZA_COLORS and applies as-is.

colourful: true

filekinds:
  normal:
    foreground: "#f0e0dd"
  directory:
    foreground: "#a8313f"
    is_bold: true
  symlink:
    foreground: "#4fada0"
    is_italic: true
  executable:
    foreground: "#d94f5c"
    is_bold: true
  pipe:
    foreground: "#d9954f"
  socket:
    foreground: "#c14fa8"
  block_device:
    foreground: "#4f8fd9"
  char_device:
    foreground: "#4f8fd9"
  special:
    foreground: "#d9954f"
  mount_point:
    foreground: "#a8313f"
    is_bold: true

perms:
  user_read:
    foreground: "#d94f5c"
  user_write:
    foreground: "#ff4d4d"
  user_execute_file:
    foreground: "#a8313f"
    is_bold: true
  user_execute_other:
    foreground: "#a8313f"
  group_read:
    foreground: "#4a1f22"
  group_write:
    foreground: "#ff4d4d"
  group_execute:
    foreground: "#4a1f22"
  other_read:
    foreground: "#331519"
  other_write:
    foreground: "#ff4d4d"
  other_execute:
    foreground: "#331519"
  special_user_file:
    foreground: "#d9954f"
  special_other:
    foreground: "#d9954f"
  attribute:
    foreground: "#4fada0"

size:
  number_byte:
    foreground: "#f0e0dd"
  number_kilo:
    foreground: "#d94f5c"
  number_mega:
    foreground: "#a8313f"
  number_giga:
    foreground: "#d9954f"
  number_huge:
    foreground: "#ff4d4d"
    is_bold: true
  unit_byte:
    foreground: "#6b5452"
  unit_kilo:
    foreground: "#6b5452"
  unit_mega:
    foreground: "#6b5452"
  unit_giga:
    foreground: "#6b5452"
  unit_huge:
    foreground: "#6b5452"

users:
  user_you:
    foreground: "#a8313f"
    is_bold: true
  user_root:
    foreground: "#ff4d4d"
    is_bold: true
  user_other:
    foreground: "#8a706d"
  group_yours:
    foreground: "#d94f5c"
  group_other:
    foreground: "#8a706d"
  group_root:
    foreground: "#ff4d4d"

links:
  normal:
    foreground: "#6b5452"
  multi_link_file:
    foreground: "#d9954f"

git:
  new:
    foreground: "#a8313f"
  modified:
    foreground: "#d9954f"
  deleted:
    foreground: "#ff4d4d"
  renamed:
    foreground: "#4f8fd9"
  typechange:
    foreground: "#4fada0"
  ignored:
    foreground: "#6b5452"
  conflicted:
    foreground: "#c14fa8"

git_repo:
  branch_main:
    foreground: "#a8313f"
    is_bold: true
  branch_other:
    foreground: "#d94f5c"
  git_clean:
    foreground: "#a8313f"
  git_dirty:
    foreground: "#ff4d4d"

file_type:
  image:
    foreground: "#c14fa8"
  video:
    foreground: "#c14fa8"
  music:
    foreground: "#4f8fd9"
  lossless:
    foreground: "#4f8fd9"
  crypto:
    foreground: "#a8313f"
    is_bold: true
  document:
    foreground: "#f0e0dd"
  compressed:
    foreground: "#ff4d4d"
  temp:
    foreground: "#6b5452"
    is_dimmed: true
  compiled:
    foreground: "#d9954f"
  build:
    foreground: "#d9954f"
    is_bold: true
    is_underline: true
  source:
    foreground: "#d94f5c"

punctuation:
  foreground: "#4a1f22"
date:
  foreground: "#d94f5c"
inode:
  foreground: "#6b5452"
blocks:
  foreground: "#6b5452"
header:
  foreground: "#a8313f"
  is_underline: true
octal:
  foreground: "#4fada0"
symlink_path:
  foreground: "#4fada0"
control_char:
  foreground: "#ff4d4d"
broken_symlink:
  foreground: "#ff4d4d"
  is_bold: true
broken_path_overlay:
  foreground: "#ff4d4d"
  is_dimmed: true
