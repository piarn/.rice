# Forest Night — generated by ~/.rice/bin/apply-theme from ~/.rice/themes/forest-night/theme.toml.
# Loaded via EZA_CONFIG_DIR=~/.rice/eza (must be named theme.yml), set from
# ~/.dots/fish/.config/fish/conf.d/00-rice.fish -> ~/.rice/eza/colors.fish.
#
# NOTE: eza applies LS_COLORS, then EZA_COLORS, *after* this file — so the
# ten classic file-kind codes (di, ln, ex, pi, so, bd, cd, or) get
# overridden by whatever LS_COLORS this system already exports (dircolors).
# ~/.rice/eza/colors.fish sets an EZA_COLORS that reclaims those specific
# codes to match the palette below; everything else here isn't touched by
# LS_COLORS/EZA_COLORS and applies as-is.

colourful: true

filekinds:
  normal:
    foreground: "#d6f2dc"
  directory:
    foreground: "#2f6b44"
    is_bold: true
  symlink:
    foreground: "#4fd8b0"
    is_italic: true
  executable:
    foreground: "#4bab6d"
    is_bold: true
  pipe:
    foreground: "#e0b84f"
  socket:
    foreground: "#c77dd1"
  block_device:
    foreground: "#4fa8d8"
  char_device:
    foreground: "#4fa8d8"
  special:
    foreground: "#e0b84f"
  mount_point:
    foreground: "#2f6b44"
    is_bold: true

perms:
  user_read:
    foreground: "#4bab6d"
  user_write:
    foreground: "#e0605a"
  user_execute_file:
    foreground: "#2f6b44"
    is_bold: true
  user_execute_other:
    foreground: "#2f6b44"
  group_read:
    foreground: "#1f3725"
  group_write:
    foreground: "#e0605a"
  group_execute:
    foreground: "#1f3725"
  other_read:
    foreground: "#18291c"
  other_write:
    foreground: "#e0605a"
  other_execute:
    foreground: "#18291c"
  special_user_file:
    foreground: "#e0b84f"
  special_other:
    foreground: "#e0b84f"
  attribute:
    foreground: "#4fd8b0"

size:
  number_byte:
    foreground: "#d6f2dc"
  number_kilo:
    foreground: "#4bab6d"
  number_mega:
    foreground: "#2f6b44"
  number_giga:
    foreground: "#e0b84f"
  number_huge:
    foreground: "#e0605a"
    is_bold: true
  unit_byte:
    foreground: "#4b584e"
  unit_kilo:
    foreground: "#4b584e"
  unit_mega:
    foreground: "#4b584e"
  unit_giga:
    foreground: "#4b584e"
  unit_huge:
    foreground: "#4b584e"

users:
  user_you:
    foreground: "#2f6b44"
    is_bold: true
  user_root:
    foreground: "#e0605a"
    is_bold: true
  user_other:
    foreground: "#6a7c6e"
  group_yours:
    foreground: "#4bab6d"
  group_other:
    foreground: "#6a7c6e"
  group_root:
    foreground: "#e0605a"

links:
  normal:
    foreground: "#4b584e"
  multi_link_file:
    foreground: "#e0b84f"

git:
  new:
    foreground: "#2f6b44"
  modified:
    foreground: "#e0b84f"
  deleted:
    foreground: "#e0605a"
  renamed:
    foreground: "#4fa8d8"
  typechange:
    foreground: "#4fd8b0"
  ignored:
    foreground: "#4b584e"
  conflicted:
    foreground: "#c77dd1"

git_repo:
  branch_main:
    foreground: "#2f6b44"
    is_bold: true
  branch_other:
    foreground: "#4bab6d"
  git_clean:
    foreground: "#2f6b44"
  git_dirty:
    foreground: "#e0605a"

file_type:
  image:
    foreground: "#c77dd1"
  video:
    foreground: "#c77dd1"
  music:
    foreground: "#4fa8d8"
  lossless:
    foreground: "#4fa8d8"
  crypto:
    foreground: "#2f6b44"
    is_bold: true
  document:
    foreground: "#d6f2dc"
  compressed:
    foreground: "#e0605a"
  temp:
    foreground: "#4b584e"
    is_dimmed: true
  compiled:
    foreground: "#e0b84f"
  build:
    foreground: "#e0b84f"
    is_bold: true
    is_underline: true
  source:
    foreground: "#4bab6d"

punctuation:
  foreground: "#1f3725"
date:
  foreground: "#4bab6d"
inode:
  foreground: "#4b584e"
blocks:
  foreground: "#4b584e"
header:
  foreground: "#2f6b44"
  is_underline: true
octal:
  foreground: "#4fd8b0"
symlink_path:
  foreground: "#4fd8b0"
control_char:
  foreground: "#e0605a"
broken_symlink:
  foreground: "#e0605a"
  is_bold: true
broken_path_overlay:
  foreground: "#e0605a"
  is_dimmed: true
