# Vivid — true-black background, high-saturation ANSI palette.
# Included from ~/.config/ghostty/config via `config-file = ?~/.rice/ghostty/theme.conf`.

background = #000000
foreground = #e6e6e6

cursor-color = #ffffff
cursor-text = #000000

selection-background = #3a3a3a
selection-foreground = #ffffff

# normal
palette = 0=#1c1c1c
palette = 1=#ff5555
palette = 2=#50fa7b
palette = 3=#ffcc00
palette = 4=#3f8fff
palette = 5=#ff3fd0
palette = 6=#00e6e6
palette = 7=#e6e6e6

# bright
palette = 8=#6c6c6c
palette = 9=#ff6e6e
palette = 10=#69ff94
palette = 11=#ffff66
palette = 12=#6ea8ff
palette = 13=#ff7ae0
palette = 14=#5cf5f5
palette = 15=#ffffff
