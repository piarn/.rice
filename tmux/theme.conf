# Forest Night — generated by ~/.rice/bin/apply-theme from ~/.rice/themes/forest-night/theme.toml.
# Sourced from ~/.dots/tmux/.config/tmux/tmux.conf via
# `source-file ~/.rice/tmux/theme.conf`.

set -g status-style "bg=#060b07,fg=#2f6b44"

set -g status-left-style "bg=#060b07,fg=#2f6b44"
set -g status-right-style "bg=#060b07,fg=#4bab6d"

setw -g window-status-style "bg=#060b07,fg=#1f3725"
setw -g window-status-current-style "bg=#2f6b44,fg=#060b07,bold"
setw -g window-status-activity-style "bg=#060b07,fg=#e0605a"
setw -g window-status-bell-style "bg=#060b07,fg=#e0605a,bold"

set -g pane-border-style "fg=#18291c"
set -g pane-active-border-style "fg=#2f6b44"

set -g message-style "bg=#060b07,fg=#2f6b44"
set -g message-command-style "bg=#060b07,fg=#4bab6d"

set -g mode-style "bg=#2f6b44,fg=#060b07"

set -g display-panes-active-colour "#2f6b44"
set -g display-panes-colour "#1f3725"

set -g clock-mode-colour "#2f6b44"
