# Crimson — generated by ~/.rice/bin/apply-theme from ~/.rice/themes/crimson/theme.toml.
# Sourced from ~/.dots/tmux/.config/tmux/tmux.conf via
# `source-file ~/.rice/tmux/theme.conf`.

set -g status-style "bg=#140808,fg=#a8313f"

set -g status-left-style "bg=#140808,fg=#a8313f"
set -g status-right-style "bg=#140808,fg=#d94f5c"

setw -g window-status-style "bg=#140808,fg=#4a1f22"
setw -g window-status-current-style "bg=#a8313f,fg=#140808,bold"
setw -g window-status-activity-style "bg=#140808,fg=#ff4d4d"
setw -g window-status-bell-style "bg=#140808,fg=#ff4d4d,bold"

set -g pane-border-style "fg=#331519"
set -g pane-active-border-style "fg=#a8313f"

set -g message-style "bg=#140808,fg=#a8313f"
set -g message-command-style "bg=#140808,fg=#d94f5c"

set -g mode-style "bg=#a8313f,fg=#140808"

set -g display-panes-active-colour "#a8313f"
set -g display-panes-colour "#4a1f22"

set -g clock-mode-colour "#a8313f"
