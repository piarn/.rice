# Toxic — black & toxic-waste-green status bar, panes, messages.
# Sourced from ~/.dots/tmux/.config/tmux/tmux.conf via
# `source-file ~/.rice/tmux/theme.conf`.

set -g status-style "bg=#000000,fg=#39FF14"

set -g status-left-style "bg=#000000,fg=#39FF14"
set -g status-right-style "bg=#000000,fg=#ADFF2F"

setw -g window-status-style "bg=#000000,fg=#1F4D0F"
setw -g window-status-current-style "bg=#39FF14,fg=#000000,bold"
setw -g window-status-activity-style "bg=#000000,fg=#FF3B30"
setw -g window-status-bell-style "bg=#000000,fg=#FF3B30,bold"

set -g pane-border-style "fg=#143D0A"
set -g pane-active-border-style "fg=#39FF14"

set -g message-style "bg=#000000,fg=#39FF14"
set -g message-command-style "bg=#000000,fg=#ADFF2F"

set -g mode-style "bg=#39FF14,fg=#000000"

set -g display-panes-active-colour "#39FF14"
set -g display-panes-colour "#1F4D0F"

set -g clock-mode-colour "#39FF14"
