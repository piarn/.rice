# The greeter's compositor. greetd starts it as its `greetd` user
# (greetd.toml), it runs the quickshell greeter, and exits as soon as that
# does: after a login, or on a crash, after which greetd starts it again.
# No bar, no binds: nothing reachable but the greeter.
output * bg #1e1e2e solid_color

input type:touchpad {
    tap enabled
    natural_scroll enabled
    dwt enabled
}

seat * hide_cursor when-typing enable

# QML2_IMPORT_PATH: the `quickshell` theme module (Colors), as in the user
# session. The XDG dirs keep quickshell's cache and state out of greetd's home.
exec "env QML2_IMPORT_PATH=/etc/greetd/quickshell/theme XDG_CACHE_HOME=/var/lib/qs-greeter/cache XDG_STATE_HOME=/var/lib/qs-greeter/state XDG_DATA_HOME=/var/lib/qs-greeter/data qs -p /etc/greetd/quickshell; swaymsg exit"
