# laptop — undocked: laptop panel only, externals disabled
# No explicit resolution on eDP-1: this profile is shared across laptops
# with different native panel resolutions, and forcing one machine's
# native mode onto another's panel makes sway letterbox it (black bars
# top/bottom). Omitting it lets sway use each panel's own preferred mode.
# requires: eDP-1
output eDP-1 position 0,0 transform normal
output "ASUSTek COMPUTER INC ASUS XG49V 0x0002C82E" disable
output "Dell Inc. DELL S2721HS 3953P83" disable
