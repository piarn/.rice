# present — laptop panel mirrored onto whatever is on the HDMI port
#
# Sway can't mirror outputs natively, so HDMI-A-1 stays a real output and
# wl-mirror runs full-screen on it, showing a live copy of eDP-1. Both are
# 1920x1080 so the copy is pixel-for-pixel, no scaling or letterboxing.
# HDMI is pinned to 1920x1080@60 rather than a TV's 4K@30 default: every
# TV/projector does it and it matches the laptop panel.
#
# Matched by connector name, not make/model/serial: HDMI-A-1 is the
# laptop's own port (no Thunderbolt renumbering), and the point is to
# work with any venue's TV/projector, not one specific screen.
#
# Workspaces are not mirrored per se — HDMI never gets a workspace of its
# own: 1-10 are pinned to eDP-1 and HDMI only ever shows `mirror`, which
# holds nothing but wl-mirror (hidden from the bar's workspace strip). So
# switching workspaces on the laptop switches what the audience sees.
# ~/.rice/bin/present-mirror enforces that (moving back any workspace that
# already landed on HDMI) and (re)starts wl-mirror on every sway reload;
# apply-layout kills wl-mirror when switching to any other layout
# (including the auto switch to `laptop` when HDMI is unplugged).
# requires: HDMI-A-1,eDP-1
output eDP-1    position 0,0 transform normal
output HDMI-A-1 resolution 1920x1080@60Hz position 1920,0 transform normal

# keep keyboard focus on the laptop, and don't let swayidle lock the
# screen mid-talk while the mirror is up
no_focus   [app_id="at.yrlf.wl_mirror"]
for_window [app_id="at.yrlf.wl_mirror"] inhibit_idle visible
workspace mirror output HDMI-A-1
workspace 1  output eDP-1
workspace 2  output eDP-1
workspace 3  output eDP-1
workspace 4  output eDP-1
workspace 5  output eDP-1
workspace 6  output eDP-1
workspace 7  output eDP-1
workspace 8  output eDP-1
workspace 9  output eDP-1
workspace 10 output eDP-1
assign [app_id="at.yrlf.wl_mirror"] workspace mirror
exec_always ~/.rice/bin/present-mirror
