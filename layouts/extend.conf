# extend — laptop panel + whatever is on the HDMI port, as a second screen
#
# The non-mirrored twin of `present`: the HDMI display is its own output to
# the right of the laptop, with its own workspaces. Not picked by
# `apply-layout --auto`: it requires the same outputs as present and loses
# that tie by name, so plugging in HDMI mirrors by default. Switch to it
# with the system tab's display tile (or `apply-layout extend`).
# requires: HDMI-A-1,eDP-1
output eDP-1    position 0,0 transform normal
output HDMI-A-1 resolution 1920x1080@60Hz position 1920,0 transform normal
