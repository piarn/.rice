# home-office — docked: ASUS ultrawide + Dell 27" (flipped) + laptop panel
#
# Identified by make/model/serial, not connector name (DP-N) — Thunderbolt
# reconnects renumber connectors (DP-5 became DP-7, DP-4 became DP-6 after
# one unplug/replug), so matching by name breaks on every replug.
# requires: ASUSTek COMPUTER INC ASUS XG49V 0x0002C82E,Dell Inc. DELL S2721HS 3953P83,eDP-1
output "ASUSTek COMPUTER INC ASUS XG49V 0x0002C82E" resolution 3840x1080 position 0,0    transform normal
output "Dell Inc. DELL S2721HS 3953P83"             resolution 1920x1080 position 3840,0 transform 180
output eDP-1                                        position 5760,0 transform normal
