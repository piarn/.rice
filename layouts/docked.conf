# docked — desk, laptop lid closed: only the two externals, eDP-1 off
#
# Same physical outputs as home-office, but eDP-1 disabled — for when
# you're at the desk and don't want the laptop panel lit/tiled in.
# Not picked by `apply-layout --auto`: eDP-1 stays enumerated by sway
# even with the lid closed, so the connected-output set here is
# identical to home-office's and would tie against it. Switch to this
# one manually with `apply-layout docked`.
# requires: ASUSTek COMPUTER INC ASUS XG49V 0x0002C82E,Dell Inc. DELL S2721HS 3953P83
output "ASUSTek COMPUTER INC ASUS XG49V 0x0002C82E" resolution 3840x1080 position 0,1080 transform normal
output "Dell Inc. DELL S2721HS 3953P83"             resolution 1920x1080 position 960,0  transform 180
output eDP-1 disable
