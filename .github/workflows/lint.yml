# Static checks on every push: shellcheck over every sh/bash script in the
# repo (found by shebang, so new scripts are covered without listing them)
# then tests/run.sh (the desktop scripts, with quickshell/sway stubbed).
name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: shellcheck
        run: |
          mapfile -t scripts < <(
            git ls-files | while IFS= read -r f; do
              [ -f "$f" ] && head -n1 "$f" | grep -Eq '^#!.*\b(ba)?sh\b' && echo "$f"
            done
          )
          printf '%s\n' "${scripts[@]}"
          shellcheck --severity=warning --external-sources "${scripts[@]}"

      - name: tests
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nodejs >/dev/null
          bash tests/run.sh
