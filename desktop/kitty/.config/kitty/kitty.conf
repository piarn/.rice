font_family JetBrainsMono Nerd Font
font_size 12.0
disable_ligatures never
cursor_shape underline
window_padding_width 8
confirm_os_window_close 0
enable_audio_bell no
allow_remote_control yes
keyboard_protocol none
map ctrl+shift+r set_tab_title

# Colors (the fixed palette)
cursor #ffffff
cursor_text_color #0b0b0b

foreground #d0d0d0
background #0b0b0b

selection_foreground #d0d0d0
selection_background #2c2c2c

# normal
color0 #0b0b0b
color1 #c46a6a
color2 #bdbdbd
color3 #c2a061
color4 #7f93ad
color5 #a08aad
color6 #7fa8a3
color7 #d0d0d0

# bright
color8  #5f5f5f
color9  #d99a9a
color10 #e6e6e6
color11 #d6bd8c
color12 #a8b7cb
color13 #c0b0cb
color14 #a8c6c2
color15 #f2f2f2

# Reloads this file into every open kitty window as soon as it changes on
# disk — no signal or restart needed, unlike foot.
reload_config_on_change yes
