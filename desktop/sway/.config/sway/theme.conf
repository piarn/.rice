# Looks: no gaps, a 1px border (none when a window is alone on its
# workspace), no titlebars outside tabbed/stacked containers, solid black
# behind everything. The palette is the fixed black/gray one.
gaps inner 0
gaps outer 0
# `gaps` above only applies to workspaces created after it's read; this
# clears them on any already open, e.g. after a reload.
exec_always swaymsg 'gaps inner all set 0' && swaymsg 'gaps outer all set 0'
default_border pixel 1
default_floating_border pixel 1
hide_edge_borders --i3 smart
output * bg #0b0b0b solid_color

# class                     border    bg        text      indicator child_border
client.focused              #858585   #161616   #e6e6e6   #bdbdbd   #858585
client.focused_inactive     #2c2c2c   #0b0b0b   #858585   #2c2c2c   #2c2c2c
client.unfocused            #1c1c1c   #0b0b0b   #5f5f5f   #1c1c1c   #1c1c1c
client.urgent               #c46a6a   #0b0b0b   #c46a6a   #c46a6a   #c46a6a
client.placeholder          #0b0b0b   #0b0b0b   #bdbdbd   #0b0b0b   #0b0b0b
client.background           #0b0b0b
