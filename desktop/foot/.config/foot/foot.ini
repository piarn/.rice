# -*- conf -*-
# The terminal. Splits and tabs are tmux's job.
font=monospace:size=11
pad=8x8

[cursor]
style=underline

[bell]
system=no

[colors-dark]
cursor=0b0b0b ffffff
background=0b0b0b
foreground=d0d0d0

selection-foreground=d0d0d0
selection-background=2c2c2c

# normal
regular0=0b0b0b
regular1=c46a6a
regular2=bdbdbd
regular3=c2a061
regular4=7f93ad
regular5=a08aad
regular6=7fa8a3
regular7=d0d0d0

# bright
bright0=5f5f5f
bright1=d99a9a
bright2=e6e6e6
bright3=d6bd8c
bright4=a8b7cb
bright5=c0b0cb
bright6=a8c6c2
bright7=f2f2f2
