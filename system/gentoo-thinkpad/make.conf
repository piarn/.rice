COMMON_FLAGS="-march=znver2 -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
RUST_FLAGS="-C target-cpu=znver2"
MAKEOPTS="-j7 -l10"
EMERGE_DEFAULT_OPTS="--jobs=2 --load-average=10 --ask --verbose"
PORTAGE_NICENESS=15
FEATURES="getbinpkg binpkg-request-signature parallel-fetch"
USE="wayland -X pipewire screencast dbus udev policykit vaapi vulkan zstd lz4 bluetooth networkmanager qt6 -qt5 -gnome -kde -cups -doc"
VIDEO_CARDS="amdgpu radeonsi"
INPUT_DEVICES="libinput"
ACCEPT_LICENCE="-* @FREE @BINARY-REDISTRIBUTABLE"
GRUB_PLATFORMS=""
L10N="en lt"
LC_MESSAGES=C.UTF-8
GENTOO_MIRRORs="https://distfiles.gentoo.org https://mirror.init7.net/gentoo/ https://ftp.fau.de/gentoo"
